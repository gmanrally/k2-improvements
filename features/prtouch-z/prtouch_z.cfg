# Strain-gauge Z endstop (prtouch v3 hardware) as chip 'prtouch' -
# coexists with the cartographer. See prtouch_z.py.
#
# Options mirror the stock [prtouch_v3] section (the same compiled
# PRTouchEndstopWrapper reads them). Source: 86D2 custom/prtouch_v3.cfg.
#
# NOTE: enabling this section alone only LOADS the strain system (safe,
# motionless). Z homing only switches to strain when [stepper_z]
# endstop_pin is changed to prtouch:z_virtual_endstop - a separate,
# deliberate step after the load and tap tests pass.
[prtouch_z]
z_offset: 0
speed: 5
quick_lift_speed: 100
samples: 1
samples_result: average
samples_tolerance_retries: 5
samples_tolerance: 0.5
prth_clr_probe_pos: 150,355
step_swap_pin: !PC7
pres_swap_pin: nozzle_mcu:PA15
prth_msg_show: True
pres_cs0_pin: nozzle_mcu:PB13, nozzle_mcu:PB14
pres_tri_hold: 4000, 10000, 500
enable_not_linear_comp: True
pres_cfg_regs: 60
prth_max_chps: 8
prth_tri_zacc: 1000
prth_min_fans: 0.6
high_low_temp_leveling: True
bed_mesh_fall_comp_diagonal: -0.045, -0.045, -0.025, -0.025, -0.02
bed_mesh_fall_comp_axis: -0.055, -0.055, -0.035, 0, 0, 0, -0.025, -0.025, -0.035
need_steady_regional: 0.8
