[mcu cartographer]
serial: /dev/cartographer
restart_method: command
is_non_critical: True
reconnect_interval: 2.0
[cartographer]
mcu: cartographer
x_offset: 0
y_offset: -15
verbose: yes

# Scan settings tuned for V3 hardware on K2 Plus.
# Single pass works reliably with the PR #480 mesh-binning fix applied
# by install.sh (corner cells now get the same capture radius as interior
# cells - was asymmetric 100x smaller in the upstream plugin we clone).
# Without that patch, mesh_runs: 2 was a workaround; with it, 1 is fine.
[cartographer scan]
mesh_runs: 1

# Touch settings loosened to V3-equivalent tolerances.
# V3 hardware has ~150-200 um touch-sample variance vs V4's ~10-15 um.
# Requires the install.sh sample_range schema patch (max 0.015 -> 0.5).
[cartographer touch]
sample_range: 0.2
max_noisy_samples: 4
samples: 5

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 0
max_temp: 105

[bed_mesh]
zero_reference_position: 175, 175
speed: 150
# Bounds inset 5mm from the bed edge so the scan path turns around
# clearly outside the grid. (This doesn't on its own fix corner-empty
# cells - see [cartographer scan] mesh_runs below - but keeps things tidy.)
mesh_min: 15, 10
mesh_max: 335, 325
probe_count: 31, 31
mesh_pps: 0, 0
adaptive_margin: 10
fade_start: 5.0
fade_end: 50.0
bicubic_tension: 0.2
algorithm: bicubic
horizontal_move_z: 3
split_delta_z: 0.01
move_check_distance: 3

[stepper_y]
position_endstop: -0.4
position_min: -0.4

[stepper_z]
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0

