[mcu cartographer]
serial: /dev/cartographer
restart_method: command
is_non_critical: True
reconnect_interval: 2.0

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: -15
verbose: yes

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 0
# 120 not 105: during 70c-chamber printing the carto MCU runs 105-110c and
# the 105 guard hard-shutdowns the printer mid-print (key92 'ADC out of
# range', observed 86D2 2026-07-11 00:05). STM32G431 is rated to 125c, so
# 120 keeps real protection while clearing the measured operating range.
# NOTE: probing accuracy at these temps is a separate issue — see the
# coil-envelope handling in start_print.cfg (_CARTO_COIL_GATE).
max_temp: 120

# ---------------------------------------------------------------------------
# Bed mesh defaults — tuned for V3 hardware reliability on the K2 Plus.
# 19x19 grid + speed 150 + mesh_runs:2 gives every grid cell enough sample
# density that a single packet-loss burst on the K2's userspace USB bridge
# can't take any cell to zero ("Grid point has no valid samples"). Validated
# against many successive meshes on V3 hardware without failure.
#
# If you have V4 hardware you can push higher density (probe_count: 31, 31)
# and/or faster speed (200). V4's USB bandwidth is higher than V3 but the K2
# bridge still has limits — see README "V3 vs V4 cartographer hardware"
# section for guidance.
# ---------------------------------------------------------------------------
[bed_mesh]
zero_reference_position: 175, 175
speed: 150
mesh_min: 10, 5
mesh_max: 340, 330
probe_count: 19, 19
mesh_pps: 0, 0
adaptive_margin: 10
fade_start: 5.0
fade_end: 50.0
bicubic_tension: 0.2
algorithm: bicubic
horizontal_move_z: 3
split_delta_z: 0.01
move_check_distance: 3

# ---------------------------------------------------------------------------
# Scan-mode tuning. mesh_runs: 2 adds a second pass so each grid cell gets
# ~2x more samples — protects against stochastic single-cell-empty failures
# under occasional USB-bridge packet loss. Costs ~80s extra mesh time.
# ---------------------------------------------------------------------------
[cartographer scan]
mesh_runs: 2

# ---------------------------------------------------------------------------
# TOUCH-MODE TUNING — V3 hardware defaults.
#
# The V4 cartographer plugin's default sample_range is 0.015 (15 µm). V4
# hardware can routinely meet that. V3 hardware has 150-200 µm touch
# variance and CANNOT — every V3 touch calibration fails at the V4 default.
# install.sh patches the plugin's schema cap (0.015 -> 0.5) so the values
# below are accepted at config-load time.
#
# IF YOU HAVE V4 HARDWARE: comment out this entire [cartographer touch]
# block. The V4-plugin defaults are correct for you. See README.
# ---------------------------------------------------------------------------
[cartographer touch]
samples: 5
max_noisy_samples: 4
sample_range: 0.2

[stepper_y]
position_endstop: -0.4
position_min: -0.4

[stepper_z]
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0

