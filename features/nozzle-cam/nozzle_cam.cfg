[gcode_shell_command nozzle_cam_on]
command: /mnt/UDISK/bin/nozzle-cam.sh on
timeout: 45.0
verbose: True

[gcode_shell_command nozzle_cam_off]
command: /mnt/UDISK/bin/nozzle-cam.sh off
timeout: 10.0
verbose: True

[gcode_macro NOZZLE_CAM_ON]
description: Power the nozzle cam and start an MJPEG stream on port 8081
gcode:
    RUN_SHELL_COMMAND CMD=nozzle_cam_on
    UPDATE_DELAYED_GCODE ID=_NOZZLE_CAM_AUTO_OFF DURATION=600

[gcode_macro NOZZLE_CAM_OFF]
description: Stop the nozzle cam stream and power it down
gcode:
    UPDATE_DELAYED_GCODE ID=_NOZZLE_CAM_AUTO_OFF DURATION=0
    RUN_SHELL_COMMAND CMD=nozzle_cam_off

[delayed_gcode _NOZZLE_CAM_AUTO_OFF]
gcode:
    RUN_SHELL_COMMAND CMD=nozzle_cam_off
