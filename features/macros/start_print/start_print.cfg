[gcode_macro _START_PRINT_VARS]
######################################################################
# copy this to overrides.cfg
######################################################################
variable_offset_PLA: 0
variable_offset_PETG: 0
variable_offset_ABS: 0
variable_offset_ASA: 0
variable_offset_DEFAULT: 0
variable_offset_PROBE: 0
variable_heat_soak: 0 # minutes
# Learned soak offset (mm), applied on high-temp jobs where probing happened
# BEFORE the chamber soak (see M191): frame/bed thermal growth between the
# pre-soak touch-home and the first layer. Tune per printer: run a high-temp
# job, babystep the first layer to perfection, put that babystep value here.
# Positive = raise nozzle.
variable_soak_offset: 0.0
gcode:


# Tracks whether M191 already ran the full probe suite before the chamber
# soak (high-temp flow). START_PRINT consumes and resets this flag.
[gcode_macro _PROBE_STATE]
variable_preprobed: 0
gcode:


[gcode_macro _CARTO_COIL_GATE]
description: Block until the cartographer coil is inside its reliable envelope
gcode:
  # V4 touch fails above ~85c coil, scan above ~88c (measured 2026-07-10,
  # 3 probes / 2 machines). Gate probing at 78c for margin. Vent to get
  # there if needed, then restore the exhaust target.
  {% set coil = printer["temperature_sensor cartographer_coil"].temperature %}
  {% if coil > 78.0 %}
    {% set restore = printer["heater_generic chamber_heater"].target %}
    {% set restore = restore if restore > 0 else 80 %}
    RESPOND MSG="Cartographer coil at {'%.0f' % coil}c - venting below 78c before probing"
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET=35
    TEMPERATURE_WAIT SENSOR="temperature_sensor cartographer_coil" MAXIMUM=78
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={restore}
    RESPOND MSG="Coil inside envelope - probing"
  {% endif %}


[gcode_macro _MESH_SANITY]
description: Abort the print if the probed mesh spread indicates a mechanical problem
gcode:
  # A healthy K2 bed probes ~0.3-0.4mm corner to corner AFTER z-tilt. A
  # spread beyond 0.6mm means desynced dual-Z, a badly seated plate, or a
  # probing fault - printing on it wastes a part. Fail fast instead.
  {% set m = printer.bed_mesh.probed_matrix %}
  {% if m and m|length > 0 %}
    {% set ns = namespace(mn=999.0, mx=-999.0) %}
    {% for row in m %}
      {% for v in row %}
        {% if v < ns.mn %}{% set ns.mn = v %}{% endif %}
        {% if v > ns.mx %}{% set ns.mx = v %}{% endif %}
      {% endfor %}
    {% endfor %}
    {% set spread = ns.mx - ns.mn %}
    {% if spread > 0.6 %}
      {action_raise_error("Mesh sanity failed: %.3fmm spread (limit 0.6mm). Check dual-Z sync / bed plate seating before printing." % spread)}
    {% else %}
      RESPOND MSG="Mesh sanity OK: {'%.3f' % spread}mm spread"
    {% endif %}
  {% endif %}


[gcode_macro START_PRINT]
gcode:
  STATUS_MSG MSG="Start print macro called with {params}"
  BOX_START_PRINT
  G90
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}
  {% set EXTRUDER_WAITTEMP = 140 %}
  {% set MATERIAL = params.MATERIAL|default("")|string %}
  {% set SOAK_TIME = params.SOAK_TIME|default(printer["gcode_macro _START_PRINT_VARS"].heat_soak)|float %}
  {% set NEEDS_HEAT_BUMP = MATERIAL in ["ASA", "ABS"] %}
  {% set PREPROBED = printer["gcode_macro _PROBE_STATE"].preprobed|int %}

  STATUS_MSG MSG="Setting bed to {BED_TEMP}°C..."
  M140 S{BED_TEMP}

  {% if CHAMBER_TEMP > 0 %}
    STATUS_MSG MSG="Setting chamber to {CHAMBER_TEMP}°C..."
    M141 S{CHAMBER_TEMP}
  {% endif %}

  {% set OFFSET = printer["gcode_macro _START_PRINT_VARS"].get("offset_" + MATERIAL|lower, printer["gcode_macro _START_PRINT_VARS"].offset_default) %}
  STATUS_MSG MSG="Setting Z offset for {MATERIAL} of {OFFSET}..."
  SET_GCODE_OFFSET Z={OFFSET}

  HOME_IF_NEEDED

  STATUS_MSG MSG="Waiting for bed to reach {BED_TEMP}°C..."
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - 0.5} MAXIMUM={BED_TEMP + 1}

  # soak countdown
  {% for i in range(0, (SOAK_TIME * 60) | int, 60) %}
    {% set COUNTDOWN = (SOAK_TIME * 60) | int - i %}
    STATUS_MSG MSG="Soaking: {COUNTDOWN // 60} min {COUNTDOWN % 60} sec left"
    G4 P{(60000 if COUNTDOWN > 60 else COUNTDOWN * 1000)}
  {% endfor %}

  {% if CHAMBER_TEMP > 40 %} #No chamber heater/wait temp if temp < 40. Change if needed.
    STATUS_MSG MSG="Waiting for chamber to reach {CHAMBER_TEMP}°C..."
    M191 S{CHAMBER_TEMP}
  {% endif %}

  {% if PREPROBED == 1 %}
    # ------------------------------------------------------------------
    # High-temp flow: M191 already ran G28/z-tilt/mesh/touch BEFORE the
    # chamber soak (cartographer coil envelope - see M191). Re-probing now
    # would fail (coil ~90c), so consume the flag and apply the learned
    # soak offset for the thermal growth since the pre-soak touch-home.
    # ------------------------------------------------------------------
    SET_GCODE_VARIABLE MACRO=_PROBE_STATE VARIABLE=preprobed VALUE=0
    STATUS_MSG MSG="Probing was done pre-soak - skipping hot re-probe"
    {% set SOAK_OFFSET = printer["gcode_macro _START_PRINT_VARS"].get("soak_offset", 0.0)|float %}
    {% if SOAK_OFFSET != 0.0 %}
      STATUS_MSG MSG="Applying learned soak offset {SOAK_OFFSET}mm"
      SET_GCODE_OFFSET Z_ADJUST={SOAK_OFFSET} MOVE=0
    {% endif %}
    M104 S{EXTRUDER_WAITTEMP}
  {% else %}
    STATUS_MSG MSG="Rehoming Z after reaching bedtemp/soak"
    G28 Z

    STATUS_MSG MSG="Setting extruder to {EXTRUDER_WAITTEMP}°C..."
    M104 S{EXTRUDER_WAITTEMP}
    STATUS_MSG MSG="Adjusting bed tilt..."
    Z_TILT_ADJUST

# Carto/pr mesh logic
    {% if printer.cartographer %}
      _CARTO_COIL_GATE
      STATUS_MSG MSG="Carto meshing bed"
      BED_MESH_CALIBRATE PROFILE=adaptive ADAPTIVE=1
      _MESH_SANITY
      STATUS_MSG MSG="Setting Z offset with carto after nozzle clean..."
      BOX_NOZZLE_CLEAN
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM=135 MAXIMUM=155 ; Wait for nozzle temp
      CARTOGRAPHER_TOUCH_HOME
    {% elif printer.scanner %} #legacy match for deprecated scanner.py
      STATUS_MSG MSG="Carto meshing bed"
      BED_MESH_CALIBRATE PROFILE=adaptive ADAPTIVE=1
      STATUS_MSG MSG="Setting Z offset with carto after nozzle clean..."
      BOX_NOZZLE_CLEAN
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM=135 MAXIMUM=155 ; Wait for nozzle temp
      CARTOGRAPHER_TOUCH
    {% else %}
      MESH_IF_NEEDED BED_TEMP={BED_TEMP} CHAMBER_TEMP={CHAMBER_TEMP}
      {% set mesh_name = "{BED_TEMP}c_{CHAMBER_TEMP}c" %}
      STATUS_MSG MSG="Loading bed mesh: {mesh_name}..."
      BED_MESH_PROFILE LOAD={mesh_name}
    {% endif %}
  {% endif %}
  BOX_GO_TO_EXTRUDE_POS

  STATUS_MSG MSG="Setting extruder to {EXTRUDER_TEMP}°C..."
  M109 S{EXTRUDER_TEMP}

  {% if NEEDS_HEAT_BUMP and CHAMBER_TEMP > 0 %}
    {% set BUMPED_TEMP = [CHAMBER_TEMP + 5, 60]|min %}
    STATUS_MSG MSG="Applying heat bump for {MATERIAL}: chamber {CHAMBER_TEMP}°C -> {BUMPED_TEMP}°C..."
    M141 S{BUMPED_TEMP}
  {% endif %}

  SET_PIN PIN=extruder_fan VALUE=1
  M220 S100
  G21
  SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=5000 SQUARE_CORNER_VELOCITY=10
  G92 E0

  STATUS_MSG MSG="Start_Print macro has finished"



  # Helper macros
[gcode_macro STATUS_MSG]
gcode:
  {% set MESSAGE = params.MSG|default('')|string %}
  M117 {MESSAGE}
  RESPOND MSG="{MESSAGE}"

[gcode_macro HOME_IF_NEEDED]
description: Homes axes when needed
gcode:
  {% set homed = printer.toolhead.homed_axes %}

  {% if "z" not in homed %}
    G28 Z
  {% elif "x" not in homed or "y" not in homed %}
    G28 X Y
  {% else %}
    {action_respond_info("All axes already homed")}
  {% endif %}
  # RELIABILITY: the K2's G28 macro can return without all requested axes
  # homed (transient RS485 stall-report loss during sensorless homing).
  # Verify and re-issue one full G28 if anything is still missing.
  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
    {action_respond_info("Homing incomplete after G28 - retrying full home")}
    G28
  {% endif %}
