### WARNING: Do not edit this file, changes will be overwritten! ###

# to make changes, copy this macro to the overrides.cfg in the custom/ directory

[gcode_macro M191]
#TODO: should this leverage the existing M141?
description: Set and wait for chamber temperature; probes BEFORE the soak on high-temp jobs
gcode:
    SAVE_GCODE_STATE NAME=M191
    # Parameters
    {% set S = params.S|default(0)|float %}

    {% if S == 0 %}
        TURN_OFF_HEATERS
        M107
    {% else %}
        M117 Heating chamber
        {% if S > 35.0 %}
            RESPOND MSG="The chamber heater alone can not reach {S}c, using bed assist ..."
            # bed needs to raise to near the nozzle
            {% if "xyz" not in printer.toolhead.homed_axes %}
              G28
            {% endif %}
            # RELIABILITY: the K2's G28 macro can return without all axes homed
            # (transient RS485 stall-report loss). Re-check and re-issue once.
            {% if "xyz" not in printer.toolhead.homed_axes %}
              RESPOND MSG="Homing incomplete after G28 - retrying"
              G28
            {% endif %}
            G1 Z5 F600
            # Bed superheat during soak: 120c (K2 Plus bed spec max) adds
            # ~100W of chamber input vs 105c and measurably raises the
            # achievable chamber ceiling. START_PRINT resets the bed to the
            # material's real temp when printing begins, so the superheat
            # only lasts for the soak.
            {% if printer.heater_bed.target >= 120.0 %}
              RESPOND MSG="Bed target temp already high enough, not changing ..."
            {% else %}
              RESPOND MSG="Bed superheat for chamber soak: setting bed to 120c ..."
              SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=120
            {% endif %}
            SET_PIN PIN=fan2 VALUE=153
        {% endif %}

        # ------------------------------------------------------------------
        # HIGH-TEMP SOAK PRE-PROBING (cartographer machines, S >= 55):
        # V4 cartographer touch fails above ~85c coil and scan above ~88c
        # (measured 2026-07-10, 3 probes / 2 machines). A chamber soak to
        # 65-70c puts the coil at 88-95c, so ALL probing must happen BEFORE
        # the soak. Do the full probe suite now — bed already at superheat
        # temp so the plate shape is settled — then flag it so START_PRINT
        # skips its post-soak probing and applies the learned soak offset.
        # ------------------------------------------------------------------
        {% set already_preprobed = printer["gcode_macro _PROBE_STATE"].preprobed|int %}
        {% if S >= 55.0 and printer.cartographer is defined and already_preprobed == 0 %}
            RESPOND MSG="High-temp soak: running probe suite BEFORE soak (coil envelope)"
            STATUS_MSG MSG="Waiting for bed before pre-soak probing..."
            TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={printer.heater_bed.target - 2}
            _CARTO_COIL_GATE
            STATUS_MSG MSG="Pre-soak: bed tilt..."
            Z_TILT_ADJUST
            STATUS_MSG MSG="Pre-soak: meshing..."
            BED_MESH_CALIBRATE PROFILE=adaptive ADAPTIVE=1
            _MESH_SANITY
            STATUS_MSG MSG="Pre-soak: nozzle clean + touch home..."
            M104 S140
            BOX_NOZZLE_CLEAN
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM=135 MAXIMUM=148
            CARTOGRAPHER_TOUCH_HOME
            SET_GCODE_VARIABLE MACRO=_PROBE_STATE VARIABLE=preprobed VALUE=1
            RESPOND MSG="Pre-soak probing complete - starting chamber soak to {S}c"
        {% endif %}

        # turn on the fan to help
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={S}
        # Set chamber temperature
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={S}

        # Wait indefinitely for temperature
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp"  MINIMUM={S} MAXIMUM={S+5}

        RESPOND MSG="Chamber temperature {S}c reached ..."
    {% endif %}
    RESTORE_GCODE_STATE NAME=M191
