### WARNING: Do not edit this file, changes will be overwritten! ###

# to make changes, copy this macro to the overrides.cfg in the custom/ directory

[gcode_macro M191]
description: Set and wait for chamber temperature (high-temp carto jobs: deferred soak)
gcode:
    SAVE_GCODE_STATE NAME=M191
    # Parameters
    {% set S = params.S|default(0)|float %}

    {% if S == 0 %}
        TURN_OFF_HEATERS
        M107
    {% else %}
        {% set preprobed = printer["gcode_macro _PROBE_STATE"].preprobed|int %}
        {% set hightemp_carto = S >= 55.0 and printer.cartographer is defined %}

        {% if hightemp_carto and preprobed == 0 %}
            # --------------------------------------------------------------
            # DEFERRED SOAK (first M191 call — the slicer emits this before
            # START_PRINT): start the chamber heating and RETURN WITHOUT
            # WAITING. The V4 cartographer cannot probe after a full soak
            # (touch fails >~85c coil, scan >~88c — measured 2026-07-10),
            # so START_PRINT will run the full probe suite at the print's
            # bed temp while the chamber is still warming, then call M191
            # again for the actual blocking soak.
            # --------------------------------------------------------------
            M117 Chamber heating (soak deferred until after probing)
            RESPOND MSG="High-temp job: chamber heating to {S}c started - soak deferred until probing is done"
            SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={S}
            SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={S}
        {% else %}
            M117 Heating chamber
            {% if S > 35.0 %}
                RESPOND MSG="The chamber heater alone can not reach {S}c, using bed assist ..."
                # bed needs to raise to near the nozzle
                {% if "xyz" not in printer.toolhead.homed_axes %}
                  G28
                {% endif %}
                # RELIABILITY: the K2's G28 macro can return without all axes
                # homed (transient RS485 stall-report loss). Re-issue once.
                {% if "xyz" not in printer.toolhead.homed_axes %}
                  RESPOND MSG="Homing incomplete after G28 - retrying"
                  G28
                {% endif %}
                G1 Z5 F600
                # Bed superheat during the soak: 120c (K2 Plus bed spec max)
                # adds ~100W of chamber input vs 105c and measurably raises
                # the chamber ceiling. Only applied when the bed is already
                # targeted >=115c (e.g. PA6-CF at 120) — for cooler-bed
                # materials the cool-back wait would cost more than the
                # superheat saves.
                {% if printer.heater_bed.target >= 115.0 and printer.heater_bed.target < 120.0 %}
                  RESPOND MSG="Bed superheat for chamber soak: setting bed to 120c ..."
                  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=120
                {% elif printer.heater_bed.target < 115.0 and printer.heater_bed.target > 0 %}
                  RESPOND MSG="Bed at {printer.heater_bed.target}c for this material - no superheat (cool-back would cost more than it saves)"
                {% elif printer.heater_bed.target == 0 %}
                  RESPOND MSG="Bed superheat for chamber soak: setting bed to 120c ..."
                  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=120
                {% endif %}
                SET_PIN PIN=fan2 VALUE=153
            {% endif %}
            # turn on the fan to help
            SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={S}
            # Set chamber temperature
            SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={S}

            # Wait indefinitely for temperature
            TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp"  MINIMUM={S} MAXIMUM={S+5}

            RESPOND MSG="Chamber temperature {S}c reached ..."
        {% endif %}
    {% endif %}
    RESTORE_GCODE_STATE NAME=M191
