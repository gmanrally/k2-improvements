# including some common overrides, feel free to change these to your liking

[virtual_sdcard]
forced_leveling: false

[bed_mesh]
probe_count:19,19

# --------------------------------------------------------------------------
# OPTIONAL PAUSE/RESUME GUARDS — disabled by default.
#
# Both macros below use Klipper's `rename_existing:` directive, which only
# works if the target macro is ALREADY DEFINED in the printer's loaded
# config. PAUSE_EXTERNAL exists on most K2 Plus firmware variants but not
# all (some K2 model variants ship a gcode_macro.cfg without it).
# BOX_ERROR_RESUME_PROCESS is not defined by any known stock K2 firmware.
#
# Enabling on a printer that lacks the target throws
#   key169: Existing command 'X' not found in gcode_macro rename
# at Klipper startup and halts the printer.
#
# To enable: uncomment the macro you want, restart Klipper, verify it
# loads without errors. If you get key169, your firmware doesn't have
# that macro defined — comment it back out.
# --------------------------------------------------------------------------

# Guard against the stock Creality bug where PAUSE saves extruder.target=0
# (e.g. paused before heat ramped up) and RESUME then issues M109 S0,
# silently turning the hotend off mid-print.
# [gcode_macro PAUSE_EXTERNAL]
# rename_existing: _STOCK_PAUSE_EXTERNAL
# gcode:
#   {% if printer.extruder.target|int <= 0 %}
#     {action_respond_info("PAUSE refused: extruder target is 0 - would corrupt resume state")}
#   {% else %}
#     _STOCK_PAUSE_EXTERNAL
#   {% endif %}

# Block RESUME until hotend and bed are both at their targets, so the
# print never continues with a cold nozzle or cold bed. Also bails if the
# saved hotend target is 0 (defensive - the PAUSE guard above should
# already prevent that).
# [gcode_macro BOX_ERROR_RESUME_PROCESS]
# rename_existing: _STOCK_BOX_ERROR_RESUME_PROCESS
# gcode:
#   {% set saved_hotend = printer['gcode_macro PRINTER_PARAM'].hotend_temp|int %}
#   {% set bed_target = printer.heater_bed.target|int %}
#   {% if saved_hotend == 0 %}
#     {action_respond_info("RESUME aborted: saved hotend target is 0 - set extruder temp manually then RESUME again")}
#     CANCEL_PRINT
#   {% else %}
#     {action_respond_info("RESUME: waiting for hotend %dC and bed %dC..." % (saved_hotend, bed_target))}
#     M104 S{saved_hotend}
#     M109 S{saved_hotend}
#     {% if bed_target > 0 %}
#       M190 S{bed_target}
#     {% endif %}
#     _STOCK_BOX_ERROR_RESUME_PROCESS
#   {% endif %}

# ---------------------------------------------------------------------------
# RESUME TEMPERATURE GUARD — active by default (v1.4.1).
#
# Creality's pause/resume flow "restores" the hotend to a saved value
# (PRINTER_PARAM.hotend_temp) that can be 0 or a pause-hold temp on some
# firmware builds — the print resumes, cleans the nozzle, then sits cold
# forever (observed AC9E 2026-07-11 on filament-runout pauses).
#
# Unlike the older PAUSE_EXTERNAL/BOX_ERROR_RESUME_PROCESS guards (disabled
# above — their rename targets don't exist on all firmware), PAUSE and
# RESUME are universal Klipper commands, so this hook works everywhere:
# PAUSE snapshots the true target, RESUME re-asserts it if the restore
# left the hotend colder.
# ---------------------------------------------------------------------------
[gcode_macro _RESUME_GUARD]
variable_last_temp: 0
gcode:

[gcode_macro PAUSE]
rename_existing: _GUARDED_PAUSE_BASE
gcode:
  {% if printer.extruder.target > 160 %}
    SET_GCODE_VARIABLE MACRO=_RESUME_GUARD VARIABLE=last_temp VALUE={printer.extruder.target}
    RESPOND MSG="Pause: snapshotting hotend target {printer.extruder.target}c for resume"
  {% endif %}
  _GUARDED_PAUSE_BASE {rawparams}

[gcode_macro RESUME]
rename_existing: _GUARDED_RESUME_BASE
gcode:
  {% set want = printer["gcode_macro _RESUME_GUARD"].last_temp|float %}
  {% if want > 160 and printer.extruder.target < want - 5 %}
    RESPOND MSG="Resume guard: hotend target {printer.extruder.target}c < snapshot {want}c - restoring"
    M104 S{want}
  {% endif %}
  _GUARDED_RESUME_BASE {rawparams}
  {% if want > 160 %}
    # Re-assert after the base resume too: some firmware paths set their own
    # (wrong) target inside the resume flow.
    M104 S{want}
  {% endif %}
