# including some common overrides, feel free to change these to your liking

[virtual_sdcard]
forced_leveling: false

[bed_mesh]
probe_count:19,19

# --------------------------------------------------------------------------
# OPTIONAL PAUSE/RESUME GUARDS — disabled by default.
#
# Both macros below use Klipper's `rename_existing:` directive, which only
# works if the target macro is ALREADY DEFINED in the printer's loaded
# config. PAUSE_EXTERNAL exists on most K2 Plus firmware variants but not
# all (some K2 model variants ship a gcode_macro.cfg without it).
# BOX_ERROR_RESUME_PROCESS is not defined by any known stock K2 firmware.
#
# Enabling on a printer that lacks the target throws
#   key169: Existing command 'X' not found in gcode_macro rename
# at Klipper startup and halts the printer.
#
# To enable: uncomment the macro you want, restart Klipper, verify it
# loads without errors. If you get key169, your firmware doesn't have
# that macro defined — comment it back out.
# --------------------------------------------------------------------------

# Guard against the stock Creality bug where PAUSE saves extruder.target=0
# (e.g. paused before heat ramped up) and RESUME then issues M109 S0,
# silently turning the hotend off mid-print.
# [gcode_macro PAUSE_EXTERNAL]
# rename_existing: _STOCK_PAUSE_EXTERNAL
# gcode:
#   {% if printer.extruder.target|int <= 0 %}
#     {action_respond_info("PAUSE refused: extruder target is 0 - would corrupt resume state")}
#   {% else %}
#     _STOCK_PAUSE_EXTERNAL
#   {% endif %}

# Block RESUME until hotend and bed are both at their targets, so the
# print never continues with a cold nozzle or cold bed. Also bails if the
# saved hotend target is 0 (defensive - the PAUSE guard above should
# already prevent that).
# [gcode_macro BOX_ERROR_RESUME_PROCESS]
# rename_existing: _STOCK_BOX_ERROR_RESUME_PROCESS
# gcode:
#   {% set saved_hotend = printer['gcode_macro PRINTER_PARAM'].hotend_temp|int %}
#   {% set bed_target = printer.heater_bed.target|int %}
#   {% if saved_hotend == 0 %}
#     {action_respond_info("RESUME aborted: saved hotend target is 0 - set extruder temp manually then RESUME again")}
#     CANCEL_PRINT
#   {% else %}
#     {action_respond_info("RESUME: waiting for hotend %dC and bed %dC..." % (saved_hotend, bed_target))}
#     M104 S{saved_hotend}
#     M109 S{saved_hotend}
#     {% if bed_target > 0 %}
#       M190 S{bed_target}
#     {% endif %}
#     _STOCK_BOX_ERROR_RESUME_PROCESS
#   {% endif %}

# ---------------------------------------------------------------------------
# RESUME TEMPERATURE GUARD — active by default (v1.4.1).
#
# Creality's pause/resume flow "restores" the hotend to a saved value
# (PRINTER_PARAM.hotend_temp) that can be 0 or a pause-hold temp on some
# firmware builds — the print resumes, cleans the nozzle, then sits cold
# forever (observed AC9E 2026-07-11 on filament-runout pauses).
#
# Unlike the older PAUSE_EXTERNAL/BOX_ERROR_RESUME_PROCESS guards (disabled
# above — their rename targets don't exist on all firmware), PAUSE and
# RESUME are universal Klipper commands, so this hook works everywhere:
# PAUSE snapshots the true target, RESUME re-asserts it if the restore
# left the hotend colder.
# ---------------------------------------------------------------------------
[gcode_macro _RESUME_GUARD]
variable_last_temp: 0
# Standby temperature for a held pause. 140c matches Creality's own
# PAUSE_EXTERNAL hold and START_PRINT's probe temp, so it is a value the
# machine already lives at: hot enough that the melt zone stays workable and
# the reheat is ~40-60s rather than a cold start, cool enough that PA6-CF and
# PPA stop cooking. Set to 0 to park the heater off instead (longer reheat,
# and the melt zone solidifies - expect to prime on resume).
variable_standby_temp: 140
# Seconds a pause must persist before the drop. This delay is the whole point:
# a key797 extruder-stall pause is auto-resumed in ~2s, and dropping the
# nozzle for those would turn a 2-second blip into a minute-long cold pause -
# far worse for interlayer bonding than the baking it avoids. Only pauses a
# human is actually standing over get cooled.
variable_cooldown_after_s: 90
# Seconds to hold at standby_temp before switching the nozzle heater OFF
# entirely. A pause nobody comes back to should not sit at 140c for hours:
# that is still slow degradation of PA6-CF/PPA in the melt zone, and it is
# heater power spent on nothing. After this the hotend goes to 0 and the
# resume reheats from the chamber temperature instead - slower (2-3 min) and
# the melt zone will have solidified, but nothing is being cooked.
# The BED is deliberately left alone: dropping it releases the part.
variable_standby_hold_s: 300
# ---- AUTO-RESUME -----------------------------------------------------------
# 1 = clear fault pauses by itself. The farm can flip this per printer.
variable_auto_resume: 1
# Set to 1 by PAUSE_HOLD. A deliberate pause is NEVER auto-resumed; RESUME
# clears it again. The farm's own Pause button should call PAUSE_HOLD.
variable_hold: 0
variable_resume_poll_s: 3
# Grace period after filament is re-detected, so a hand-fed strand has time to
# reach the drive gears before motion restarts. The sensor sits upstream of
# them, so resuming the instant it trips can run on air.
variable_refill_settle_s: 10
# Rapid-loop brake. Today's key797 bursts recovered fine with real printing in
# between (2.1 mm/s of filament), so a plain resume cap would have stopped
# prints that went on to finish. This instead counts only resumes with almost
# no progress between them, which is the shape of an extruder that is genuinely
# not recovering, and self-clears the moment the print makes headway.
variable_rapid_window_min: 0.5
variable_rapid_max: 20
variable_rapid: 0
variable_last_auto_pd: -1
gcode:

# Deliberate pause: inhibits auto-resume until the next RESUME.
[gcode_macro PAUSE_HOLD]
description: Pause the print and do NOT auto-resume it (for spool changes, inspection)
gcode:
  SET_GCODE_VARIABLE MACRO=_RESUME_GUARD VARIABLE=hold VALUE=1
  RESPOND MSG="Pause held by request - auto-resume inhibited until you resume"
  PAUSE {rawparams}

# Polls while paused and clears a FAULT pause. Armed by PAUSE, re-arms itself.
#
# There is no readable stall flag on these machines - motor_control publishes
# only motor_ready/is_homing/cut/dev_uuid, and the key797 extruder-stall line
# is a console response a macro cannot see. So a fault pause is identified by
# exclusion, using the one signal that separates it from a screen pause:
# PAUSE_EXTERNAL drops the hotend to 140c immediately, a fault pause leaves it
# at print temperature. Within the first poll or two that is unambiguous.
[delayed_gcode _auto_resume_poll]
gcode:
  {% set g = printer["gcode_macro _RESUME_GUARD"] %}
  {% set sname = "filament_switch_sensor filament_sensor" %}
  {% set fil = printer[sname].filament_detected if sname in printer else True %}
  {% set pd = printer.print_stats.print_duration|float / 60.0 %}
  {% if not printer.pause_resume.is_paused %}
    SET_GCODE_VARIABLE MACRO=_RESUME_GUARD VARIABLE=rapid VALUE=0
  {% elif g.auto_resume|int == 0 or g.hold|int == 1 %}
    RESPOND MSG="Auto-resume standing down - this pause is held"
  {% elif not fil %}
    RESPOND MSG="Paused with NO filament - a real runout. Feed the next spool and it resumes by itself."
  {% elif printer.extruder.target|float <= 160 %}
    UPDATE_DELAYED_GCODE ID=_auto_resume_poll DURATION={g.resume_poll_s}
  {% else %}
    {% set gap = pd - g.last_auto_pd|float %}
    {% set rapid = (g.rapid|int + 1) if (g.last_auto_pd|float >= 0 and gap < g.rapid_window_min|float) else 0 %}
    {% if rapid >= g.rapid_max|int %}
      M117 Extruder not recovering
      RESPOND TYPE=error MSG="Auto-resume STOPPED: {rapid} resumes with under {g.rapid_window_min}min of printing between them - the extruder is not recovering. Print stays paused for a person."
    {% else %}
      SET_GCODE_VARIABLE MACRO=_RESUME_GUARD VARIABLE=rapid VALUE={rapid}
      SET_GCODE_VARIABLE MACRO=_RESUME_GUARD VARIABLE=last_auto_pd VALUE={pd}
      RESPOND MSG="Auto-resume: fault pause at {pd|round(1)}min printing, filament present, hotend {printer.extruder.target|round|int}c - clearing"
      RESUME
      # Re-arm AFTER the resume (RESUME itself cancels this timer). On success
      # the next poll sees a running print and zeroes the rapid counter; if the
      # resume was refused, it retries instead of going silent.
      UPDATE_DELAYED_GCODE ID=_auto_resume_poll DURATION={g.resume_poll_s}
    {% endif %}
  {% endif %}

# Filament came back while paused -> settle, then resume.
[gcode_macro _FILAMENT_INSERTED]
gcode:
  {% set g = printer["gcode_macro _RESUME_GUARD"] %}
  {% if printer.pause_resume.is_paused and g.auto_resume|int == 1 and g.hold|int == 0 %}
    RESPOND MSG="Filament detected while paused - resuming in {g.refill_settle_s}s, push it home now"
    UPDATE_DELAYED_GCODE ID=_refill_resume DURATION={g.refill_settle_s}
  {% endif %}

[delayed_gcode _refill_resume]
gcode:
  {% set g = printer["gcode_macro _RESUME_GUARD"] %}
  {% if printer.pause_resume.is_paused and g.auto_resume|int == 1 and g.hold|int == 0 %}
    RESPOND MSG="Filament refilled - resuming"
    RESUME
  {% endif %}

# Adds the insert hook to Creality's existing sensor section. Partial section
# override, same mechanism this file already uses for [bed_mesh] probe_count
# and [printer] max_accel - the other options (switch_pin, runout_gcode,
# pause_on_runout) are untouched.
[filament_switch_sensor filament_sensor]
insert_gcode:
  _FILAMENT_INSERTED

# Fires cooldown_after_s after a pause, and only if the print is STILL paused.
# Cancelled by RESUME; the is_paused test also covers the case where the print
# was cancelled while held, so an idle machine never gets a stray 140c target.
[delayed_gcode _pause_cooldown]
gcode:
  {% set g = printer["gcode_macro _RESUME_GUARD"] %}
  {% if printer.pause_resume.is_paused and g.last_temp|float > 160 %}
    RESPOND MSG="Pause held {g.cooldown_after_s}s - dropping hotend {g.last_temp|round|int}c -> {g.standby_temp|round|int}c so it stops cooking the filament (restored on resume)"
    M104 S{g.standby_temp}
    UPDATE_DELAYED_GCODE ID=_pause_heater_off DURATION={g.standby_hold_s}
  {% endif %}

# Stage two, armed by the standby drop above: if the pause is STILL held
# standby_hold_s later, switch the nozzle heater off completely. A pause left
# overnight then sits cold rather than slow-cooking the melt zone.
[delayed_gcode _pause_heater_off]
gcode:
  {% set g = printer["gcode_macro _RESUME_GUARD"] %}
  {% if printer.pause_resume.is_paused and g.last_temp|float > 160 %}
    RESPOND MSG="Pause held a further {g.standby_hold_s}s at standby - nozzle heater OFF. Resume will reheat to {g.last_temp|round|int}c before moving, which takes a few minutes from cold."
    M104 S0
  {% endif %}

[gcode_macro PAUSE]
rename_existing: _GUARDED_PAUSE_BASE
gcode:
  {% set g = printer["gcode_macro _RESUME_GUARD"] %}
  {% if printer.extruder.target > 160 %}
    SET_GCODE_VARIABLE MACRO=_RESUME_GUARD VARIABLE=last_temp VALUE={printer.extruder.target}
    RESPOND MSG="Pause: hotend target {printer.extruder.target}c saved, standby {g.standby_temp|round|int}c in {g.cooldown_after_s}s if still paused"
    UPDATE_DELAYED_GCODE ID=_pause_cooldown DURATION={g.cooldown_after_s}
  {% endif %}
  {% if g.auto_resume|int == 1 %}
    UPDATE_DELAYED_GCODE ID=_auto_resume_poll DURATION={g.resume_poll_s}
  {% endif %}
  _GUARDED_PAUSE_BASE {rawparams}

[gcode_macro RESUME]
rename_existing: _GUARDED_RESUME_BASE
gcode:
  {% set want = printer["gcode_macro _RESUME_GUARD"].last_temp|float %}
  # Kill any pending cooldown FIRST, or a fast resume gets followed by a drop
  # into the running print. Both stages, since either may be armed.
  UPDATE_DELAYED_GCODE ID=_pause_cooldown DURATION=0
  UPDATE_DELAYED_GCODE ID=_pause_heater_off DURATION=0
  UPDATE_DELAYED_GCODE ID=_auto_resume_poll DURATION=0
  UPDATE_DELAYED_GCODE ID=_refill_resume DURATION=0
  SET_GCODE_VARIABLE MACRO=_RESUME_GUARD VARIABLE=hold VALUE=0
  {% if want > 160 and printer.extruder.target < want - 5 %}
    RESPOND MSG="Resume: reheating hotend {printer.extruder.temperature|round|int}c -> {want|round|int}c before any motion"
    M104 S{want}
    # BLOCKING, unlike the old M104-only restore: with the standby drop in
    # place the nozzle really can be 160c below target here, and resuming
    # motion into that stalls the extruder or strips the filament.
    M109 S{want}
  {% endif %}
  _RESUME_AFTER_HEAT {rawparams}

# Separate macro because Klipper renders a macro's whole template before
# running any of it - the post-M109 temperature can only be read by a LATER
# macro in the stream. Needed because this fleet demonstrably suffers the
# wait-skip fault where M109/TEMPERATURE_WAIT return instantly; without this
# check a wedged machine would resume with a 140c nozzle on a 300c material.
[gcode_macro _RESUME_AFTER_HEAT]
gcode:
  {% set want = printer["gcode_macro _RESUME_GUARD"].last_temp|float %}
  {% set now = printer.extruder.temperature|float %}
  {% if want > 160 and now < want - 25 %}
    M117 Nozzle too cold to resume
    RESPOND TYPE=error MSG="Resume HELD: nozzle {now|round|int}c against a {want|round|int}c target after the heat wait - M109 appears to have been skipped. Print stays paused. Check the hotend, then RESUME again."
  {% else %}
    _GUARDED_RESUME_BASE {rawparams}
    {% if want > 160 %}
      # Re-assert after the base resume too: some firmware paths set their own
      # (wrong) target inside the resume flow.
      M104 S{want}
    {% endif %}
  {% endif %}
